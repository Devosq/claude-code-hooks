name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check all hooks
        run: |
          set -e
          for f in hooks/*.js; do node --check "$f"; done
          echo "all hooks parse OK"
